<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap 6 Carousel</title>

  <!-- Bootstrap 6 Alpha CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-autoplay="true">
    <div class="carousel-inner rounded-5">
      <div class="carousel-item active">
        <img src="https://picsum.photos/1200/500?random=1" class="d-block w-100" alt="Slide 1">
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/1200/500?random=2" class="d-block w-100" alt="Slide 2">
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/1200/500?random=3" class="d-block w-100" alt="Slide 3">
      </div>
    </div>

    <!-- Controls + Indicators -->
    <div class="d-flex justify-content-between align-items-center mt-3">
      <div class="carousel-indicators position-static m-0">
        <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="2" aria-label="Slide 3"></button>
      </div>

      <div>
        <!-- Play / Pause button -->
        <button class="btn-icon btn-sm carousel-control-play-pause" type="button"
                data-bs-target="#carouselExampleAutoplaying"
                aria-label="Pause"
                data-bs-pause-label="Pause"
                data-bs-play-label="Play">
          <span class="carousel-icon-pause" aria-hidden="true"></span>
          <span class="carousel-icon-play" aria-hidden="true"></span>
        </button>

        <!-- Previous -->
        <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
          <span class="carousel-icon-prev" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>

        <!-- Next -->
        <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
          <span class="carousel-icon-next" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Bootstrap 6 JS (must be type="module") -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
